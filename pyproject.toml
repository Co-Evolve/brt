[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biorobot"
dynamic = ["version"]
authors = [
    { name = "Dries Marzougui", email = "dries.marzougui@gmail.com" },
]
description = "The Bio-Inspired Robotics Testbed (BRT): MuJoCo, MJX and MuJoCo Warp simulation environments of animals."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mujoco", "mjx", "jax", "reinforcement-learning", "robotics", "bio-inspired", "biology", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "jax",
    "mujoco>=3.17",
    "mujoco-mjx>=3.17",
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
# MJX's Warp implementation (backend="warp") ships inside mujoco-mjx and needs NVIDIA Warp.
warp = ["mujoco-mjx[warp]>=3.17"]
cuda = ["jax[cuda12]"]
dev = ["pytest", "pytest-xdist", "black==26.10.1"]

[project.urls]
Homepage = "https://co-evolve.github.io/brt/"
Documentation = "https://github.com/Co-Evolve/brt#readme"
Repository = "https://github.com/Co-Evolve/brt"
Issues = "https://github.com/Co-Evolve/brt/issues"

[tool.setuptools.dynamic]
version = { attr = "biorobot.__version__" }

[tool.setuptools.packages.find]
include = ["biorobot*"]

[tool.setuptools.package-data]
# The seahorse tail's meshes (STL exports of the 3D-printed prototype) and the measured inertias of its parts.
biorobot = ["seahorse/assets/meshes/*.stl", "seahorse/assets/meshes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this version equal to the black pin in pyproject.toml's `dev` extra.
      - uses: psf/black@26.10.1
        with:
          version: "26.10.1"
          options: "--check --diff"
          src: "biorobot tests scripts"
